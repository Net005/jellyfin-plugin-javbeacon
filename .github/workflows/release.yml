name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin version
        id: plugin-version
        shell: bash
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' JAVBeacon.Jellyfin/JAVBeacon.Jellyfin.csproj)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release tag matches csproj Version
        shell: bash
        run: |
          expected="v${{ steps.plugin-version.outputs.version }}"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match JAVBeacon.Jellyfin.csproj Version ($expected)" >&2
            exit 1
          }

      - name: Validate changelog entry
        shell: bash
        run: |
          version="${{ steps.plugin-version.outputs.version }}"
          escaped_version="${version//./\\.}"
          grep -Eq "^## \\[$escaped_version\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
            echo "CHANGELOG.md has no dated section for $version" >&2
            exit 1
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Jellyfin 12 plugin
        shell: bash
        run: ./build.sh

      - name: Package release zip
        shell: bash
        run: |
          version="${{ steps.plugin-version.outputs.version }}"
          mkdir -p out
          (cd dist && zip -9 "../out/Jellyfin.Plugin.JAVBeacon_v${version}_Jellyfin-12.zip" ./*)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --target "$GITHUB_SHA" --title "jellyfin-plugin-javbeacon $GITHUB_REF_NAME" --generate-notes --latest
